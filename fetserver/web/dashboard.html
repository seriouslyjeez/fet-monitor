<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FeT Monitor</title>
<style>
:root{--bg:#f4f5f7;--fg:#15181d;--mut:#667085;--card:#fff;--line:#d9dde3;--accent:#2563eb;--ok:#16a34a;--bad:#dc2626;--hi:#e0ebff;--m-practice:#64748b;--m-sighter:#d97706;--m-record:#2563eb;--m-ammo:#9333ea}
@media (prefers-color-scheme:dark){:root{--bg:#0f1216;--fg:#e8eaed;--mut:#98a2b3;--card:#181c22;--line:#2b313a;--accent:#60a5fa;--ok:#4ade80;--bad:#f87171;--hi:#1e2a44;--m-practice:#94a3b8;--m-sighter:#fbbf24;--m-record:#60a5fa;--m-ammo:#c084fc}}
*{box-sizing:border-box}body{margin:0;font:15px/1.35 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;align-items:center;gap:14px;padding:6px 14px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0}header a{color:var(--fg);text-decoration:none;padding:3px 9px;border-radius:6px;font-size:14px}header a.on{background:var(--accent);color:#fff}
#live{margin-left:auto;font-size:12px;color:var(--mut)}main{padding:12px;max-width:1500px;margin:0 auto}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:6px}.dot.on{background:var(--ok)}
.mut{color:var(--mut);font-size:13px}.num{font-variant-numeric:tabular-nums}
.badge{font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;color:#fff;white-space:nowrap}.m-practice{background:var(--m-practice)}.m-sighter{background:var(--m-sighter)}.m-record{background:var(--m-record)}.m-ammo{background:var(--m-ammo)}
button,input,select{font:inherit;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button{cursor:pointer}button.pri{background:var(--accent);color:#fff;border-color:var(--accent)}button.sel{background:var(--accent);color:#fff;border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}
.face{display:block;width:100%;height:auto;border-radius:6px}
/* all targets */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;color:inherit;text-decoration:none}
.card:hover{border-color:var(--accent)}.card.off{opacity:.55}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .face{margin:8px auto;max-width:300px}.who{font-weight:600;margin:2px 0 6px;min-height:1.35em}
.scorebox{display:flex;gap:8px;align-items:stretch}
.tot{flex:0 0 96px;border:1px solid var(--line);border-radius:8px;text-align:center;padding:6px 4px;background:var(--hi)}
.tot .big{font-size:28px;font-weight:800;line-height:1.05}.tot .sub{font-size:14px;color:var(--mut)}
.rows{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.grprow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}.grp{border:1px solid var(--line);border-radius:6px;padding:1px 2px;text-align:center;line-height:1.15;min-width:0}
.grp b{display:block;font-size:13px}.grp small{display:block;color:var(--mut);font-size:10.5px}.grp.part{border-style:dashed}
.shotrow{display:grid;gap:2px}.cell{min-width:0;text-align:center;font-size:12px;padding:3px 0;border-radius:4px;background:var(--bg);min-height:23px;font-variant-numeric:tabular-nums}
.cell.x{background:var(--accent);color:#fff;font-weight:700}.cell.m{color:var(--bad);font-weight:700}.cell.e{opacity:.5}
/* single target */
.shoot{display:grid;grid-template-columns:minmax(300px,1.5fr) minmax(290px,1fr);gap:14px;align-items:start}@media (max-width:820px){.shoot{grid-template-columns:1fr}}
.zoombar{display:flex;gap:3px;align-items:center;margin-bottom:6px;flex-wrap:wrap}.zoombar span{font-size:13px;color:var(--mut);margin-right:4px}
.zoombar button{padding:4px 9px;min-width:34px;font-size:14px}
.left .face{width:min(100%,calc(100vh - 160px));margin:0 auto}
.pager{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}.pager button{min-width:44px;font-weight:700;font-size:16px}.pager span{min-width:150px;text-align:center}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.panel h3{margin:0 0 6px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.gear{padding:3px 9px;font-size:18px;line-height:1}.title{font-size:20px;font-weight:700}
.modes{display:flex;gap:6px;margin-top:8px}.modes button{flex:1;font-weight:600;padding:9px}
table.t{width:100%;border-collapse:collapse}table.t td,table.t th{padding:3px 6px;text-align:right;border-bottom:1px solid var(--line)}
table.t th{color:var(--mut);font-weight:500;font-size:12px}table.t td:first-child,table.t th:first-child{text-align:left}
table.t td{font-variant-numeric:tabular-nums;height:27px}table.t tr.last td{background:var(--hi);font-weight:700}
.xm{color:var(--accent);font-weight:800;margin-left:4px}.miss{color:var(--bad);font-weight:700}
.lastwrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}.lastleft{flex:1 1 150px}.lastright{flex:2 1 240px;max-height:280px;overflow:auto}tr.tot-row td{font-weight:700;border-top:2px solid var(--line)}
.lastbig{display:flex;align-items:baseline;gap:10px}.lastbig .v{font-size:52px;font-weight:800;line-height:1}.lastbig .xbig{font-size:30px;color:var(--accent);font-weight:800}
.banner{background:var(--hi);border:1px solid var(--accent);border-radius:8px;padding:6px 10px;margin-bottom:10px;font-size:14px}
/* ammo test */
.lbl{font-weight:500;color:var(--mut)}.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}.kv span:first-child{color:var(--mut)}
.scroll{max-height:300px;overflow:auto}.unit{font-size:20px;color:var(--mut);font-weight:600}
table.t.kvt td{height:auto}table.t.kvt td:last-child{white-space:nowrap}
/* overlay */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:10}
#overlay.open{display:flex}.sheet{background:var(--card);border-radius:12px;max-width:520px;width:100%;padding:14px 16px}
.sheet h2{margin:0 0 4px;font-size:18px}.sheet section{border-top:1px solid var(--line);padding:10px 0}.sheet section:first-of-type{border-top:0}
/* sight adjustment */
.sightface{max-width:300px;margin:0 auto}.advice{font-size:24px;font-weight:800;margin:4px 0}.advice div{margin:2px 0}
.cprrow{display:flex;gap:8px;align-items:center}.cprrow input{width:80px}.bad{color:var(--bad)}
/* range control */
.rc table.t td,.rc table.t th{text-align:left;vertical-align:middle}.rc .bulk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.rc .scroll{max-height:none;overflow-x:auto}.rc .warnbox{border:1px solid var(--bad);border-radius:8px;padding:8px 10px;margin:8px 0}
.rc input[type=password]{width:220px;max-width:100%}.danger{color:var(--bad);border-color:var(--bad)}code{font-size:13px;word-break:break-all}
#ver{position:fixed;right:8px;bottom:6px;font-size:11px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 7px;opacity:.85;z-index:5;text-decoration:none}
.notes{white-space:pre-wrap;max-height:260px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:13px/1.45 ui-monospace,Menlo,monospace}
#ver:hover{opacity:1;color:var(--fg)}.fwjob{font-size:12px}.fwjob.bad{color:var(--bad)}.fwjob.ok{color:var(--ok)}
.sheet h4{margin:0 0 6px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.seg{display:flex;gap:6px}.seg button{flex:1}.fields{display:grid;grid-template-columns:1fr 90px;gap:6px 10px;align-items:center}.fields input{width:100%}
.rev{display:block;width:100%;text-align:left;margin-bottom:5px}details>summary{cursor:pointer;font-weight:600}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:20}
</style>
</head>
<body>
<header><h1>FeT Monitor</h1><a href="#/" id="nav-coach">All targets</a><a href="#/range" id="nav-range">Range Control</a><span id="live">connecting…</span></header>
<main id="app"></main>
<div id="overlay"></div>
<div id="toast"></div>
<a id="ver" href="https://github.com/seriouslyjeez/fet-monitor" target="_blank" rel="noopener" title="FeT Monitor on GitHub">FeT Monitor</a>
<script>
'use strict';
const API = '/api/v1', MODES = {practice: 'Practice', sighter: 'Sighter', record: 'Record', ammo: 'Ammo test'};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const dec = v => (v == null ? '–' : v.toFixed(1));
const ringR = k => 0.25 + 2.5 * (10 - k);        // outer radius of ring k in mm (ISSF 10 m air rifle)
const FULL = 26, AUTO_START = 8;                 // full view half-width in mm; Auto never zooms in past the 8 ring
const zoomHalf = k => ringR(k) + 1.5;            // view half-width when zoomed to ring k

// Auto zoom: the smallest ring (8, 7 ... 1) that holds every pellet completely, else the full target.
function autoRing(shots, pr, start) {
  let ext = 0;
  shots.forEach(s => { if (!s.miss && s.x_mm != null) ext = Math.max(ext, Math.hypot(s.x_mm, s.y_mm) + pr); });
  for (let k = start || AUTO_START; k >= 1; k--) if (ringR(k) >= ext) return k;
  return 0;
}
function halfFor(zoom, shots, pr, start) {
  if (zoom === 'auto') { const k = autoRing(shots, pr, start); return k ? zoomHalf(k) : FULL; }
  const k = parseInt(zoom, 10);
  return k >= 1 && k <= 9 ? zoomHalf(k) : FULL;
}
const modeColor = m => 'var(--m-' + (MODES[m] ? m : 'practice') + ')';
const badge = m => '<span class="badge m-' + (MODES[m] ? m : 'practice') + '">' + esc(MODES[m] || 'Practice') + '</span>';
const clock = iso => new Date(iso).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
const when = iso => new Date(iso).toLocaleString([], {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'});
const KIND_MODE = {practice: 'practice', match: 'sighter', ammo: 'ammo'};   // the mode a series kind starts in
// Review navigation. k = shots shown so far (1..full), ps = shots per target picture.
// A step moves one shot. A page jump goes to the END of the current target picture, or, if already there, to the end of
// the next one; backwards it goes to the end of the previous picture (shot 1 from the first picture).
function reviewShot(k, ps, full, move) {
  const clamp = n => Math.max(full ? 1 : 0, Math.min(full, n)), page = Math.ceil(k / ps);
  if (move === 'step+') return clamp(k + 1);
  if (move === 'step-') return clamp(k - 1);
  if (move === 'page+') { const end = Math.min(full, page * ps); return clamp(k < end ? end : end + ps); }
  if (move === 'page-') return clamp((page - 1) * ps);
  return clamp(k);
}
const reviewPage = v => (v.kind === 'ammo' ? 10 : v.bull_size);   // shots per review jump: a target picture, or ten shots in an ammo test
// Ammo tests carry two names: the shooter (fixed once the test starts) and a label (ammo, lot) that can change.
const whoText = (shooter, label) => esc(shooter || '–') + (label ? ' · <span class="lbl">' + esc(label) + '</span>' : '');
const scoreText = s => s.miss ? 'M' : dec(s.decimal);
const mm2 = v => (v == null ? '–' : v.toFixed(2));
// Ammo test overlays for the face: the oval around the group and the group centre (both in mm relative to the first shot)
function ammoMarks(v) {
  const a = v && v.ammo;
  if (!a || !a.ellipse || a.shots < 2) return {};
  const e = a.ellipse;
  return {oval: {cx: e.cx_mm, cy: e.cy_mm, a: e.outer_major_mm / 2, b: e.outer_minor_mm / 2, ang: e.angle_deg}, center: {x: a.center_x_mm, y: a.center_y_mm}};
}

// Target face. Pure function returning an SVG string. Data y is up, screen y is down.
// o: half (view half-width, mm), pellet (mm), color, mini, corner (black top-right corner = shots are not scored)
function faceSvg(shots, o) {
  o = o || {};
  const mini = !!o.mini, pr = (o.pellet || 4.5) / 2, H = o.half || FULL, col = o.color || 'var(--accent)', black = ringR(4);
  const sw = Math.max(0.06, 0.18 * H / FULL) * (mini ? 1.6 : 1), f = Math.max(0.35, Math.min(1, H / 14));   // outlines thin out as we zoom in
  let s = '<svg class="face" viewBox="' + (-H) + ' ' + (-H) + ' ' + (2 * H) + ' ' + (2 * H) + '" role="img" aria-label="Target face">' +
          '<rect x="' + (-H) + '" y="' + (-H) + '" width="' + (2 * H) + '" height="' + (2 * H) + '" fill="#fff"/><circle r="' + black + '" fill="#111"/>';
  for (let k = 1; k <= 10; k++) {
    s += '<circle r="' + ringR(k) + '" fill="' + (k === 10 ? '#fff' : 'none') + '" stroke="' + (ringR(k) <= black ? '#fff' : '#111') + '" stroke-width="' + sw + '"/>';
  }
  if (!mini) {
    for (let k = 1; k <= 8; k++) {
      const m = ringR(k) - 1.25, fill = m < black ? '#fff' : '#111';
      if (m > H - 0.9) continue;
      [[0, -m], [0, m], [-m, 0], [m, 0]].forEach(p => {
        s += '<text x="' + p[0] + '" y="' + p[1] + '" font-size="1.7" text-anchor="middle" dominant-baseline="central" fill="' + fill + '">' + k + '</text>';
      });
    }
  }
  const pts = shots.filter(x => !x.miss && x.x_mm != null);
  pts.forEach((x, i) => {
    const isLast = i === pts.length - 1, sx = x.x_mm, sy = -x.y_mm;
    if (Math.abs(sx) <= H && Math.abs(sy) <= H) {                   // pellet centre is in view
      if (x.flyer) s += '<circle class="flyer" cx="' + sx + '" cy="' + sy + '" r="' + pr + '" fill="none" stroke="#e11d48" stroke-width="' + 0.35 * f + '" stroke-dasharray="' + 0.7 * f + '"/>';   // sight adjustment: ignored shot
      else s += '<circle cx="' + sx + '" cy="' + sy + '" r="' + pr + '" fill="' + col + '" fill-opacity=".55" stroke="' +
           (isLast && !mini ? '#e11d48' : col) + '" stroke-width="' + (isLast && !mini ? 0.6 : 0.35) * f + '"/>';
      if (!mini && (!o.labelLast || isLast)) {                       // an ammo test can have hundreds of shots: label only the latest
        s += '<text x="' + sx + '" y="' + sy + '" font-size="2" text-anchor="middle" dominant-baseline="central" fill="#fff" stroke="#000" stroke-width=".12" paint-order="stroke">' + esc(x.n) + '</text>';
      }
    } else {                                                         // outside a fixed zoom: mark where it went off
      const k = (H * 0.9) / Math.max(Math.abs(sx), Math.abs(sy)), r = Math.max(0.5, H * 0.07);
      s += '<circle cx="' + (sx * k) + '" cy="' + (sy * k) + '" r="' + r + '" fill="#fff" stroke="#e11d48" stroke-width="' + (r * 0.3) + '" stroke-dasharray="' + (r * 0.6) + '"/>';
      if (!mini) s += '<text x="' + (sx * k) + '" y="' + (sy * k) + '" font-size="' + (r * 1.3) + '" text-anchor="middle" dominant-baseline="central" fill="#e11d48">' + esc(x.n) + '</text>';
    }
  });
  if (o.oval) {                                                      // ammo test: oval around the group (white halo so it shows on black and white)
    const e = o.oval, w = (mini ? 0.5 : 0.26) * Math.max(0.5, f), t = 'rotate(' + (-e.ang) + ' ' + e.cx + ' ' + (-e.cy) + ')';
    [['#fff', w * 2.6], ['#c026d3', w]].forEach(c => {
      s += '<ellipse class="goval" cx="' + e.cx + '" cy="' + (-e.cy) + '" rx="' + e.a + '" ry="' + e.b + '" transform="' + t + '" fill="none" stroke="' + c[0] + '" stroke-width="' + c[1] + '" stroke-dasharray="' + (w * 6) + ' ' + (w * 3) + '"/>';
    });
  }
  if (o.center) {                                                    // ammo test: group centre (mean point of impact)
    const c = o.center, cl = Math.max(0.9, H * (mini ? 0.07 : 0.05)), w = (mini ? 0.5 : 0.26) * Math.max(0.5, f);
    [['#fff', w * 2.6], ['#c026d3', w]].forEach(k => {
      s += '<g class="gcenter" stroke="' + k[0] + '" stroke-width="' + k[1] + '" fill="none"><line x1="' + (c.x - cl) + '" y1="' + (-c.y) + '" x2="' + (c.x + cl) + '" y2="' + (-c.y) + '"/>' +
           '<line x1="' + c.x + '" y1="' + (-c.y - cl) + '" x2="' + c.x + '" y2="' + (-c.y + cl) + '"/><circle cx="' + c.x + '" cy="' + (-c.y) + '" r="' + (cl * 0.5) + '"/></g>';
    });
  }
  if (o.corner) {                                                    // practice and sighter shots are not scored
    const L = H * (mini ? 0.34 : 0.3);
    s += '<polygon class="corner" points="' + H + ',' + (-H) + ' ' + (H - L) + ',' + (-H) + ' ' + H + ',' + (-H + L) + '" fill="#dc2626"/>';
  }
  return s + '</svg>';
}

// ---- All targets ----
function strip(v) {
  const n = v.bull_size <= 20 ? v.bull_size : v.bull_shots.length;
  let c = '';
  for (let i = 0; i < n; i++) {
    const s = v.bull_shots[i];
    c += s ? '<span class="cell' + (s.inner ? ' x' : '') + (s.miss ? ' m' : '') + '">' + esc(scoreText(s)) + '</span>' : '<span class="cell e"></span>';
  }
  return '<div class="shotrow" style="grid-template-columns:repeat(' + Math.max(1, Math.min(5, n)) + ',minmax(0,1fr))">' + c + '</div>';   // stacked 5 over 5
}
function groupsRow(v) {
  if (!v.groups.length) return '<div class="grprow"><span class="mut">no shots yet</span></div>';
  return '<div class="grprow">' + v.groups.slice(-6).map(g => '<span class="grp' + (g.complete ? '' : ' part') + '" title="shots ' + g.first + '–' + g.last + '"><b>' +
    dec(g.decimal) + '</b><small>' + g.integer + '</small>' + (g.x ? '<small>X' + g.x + '</small>' : '') + '</span>').join('') + '</div>';
}
function ammoCard(t) {
  const v = t.view, a = v.ammo, pr = a.diameter_mm / 2, half = halfFor('auto', v.bull_shots, pr, 9), e = a.ellipse;
  return '<a class="card ' + (t.online ? '' : 'off') + '" href="#/t/' + esc(t.device_id) + '">' +
    '<div class="row"><b><span class="dot ' + (t.online ? 'on' : '') + '"></span>' + esc(t.name) + '</b>' + badge(t.mode) + '</div>' +
    (t.online ? '' : '<div class="mut">offline, last seen ' + esc(clock(t.last_seen)) + '</div>') +
    faceSvg(v.bull_shots, Object.assign({mini: true, half: half, pellet: a.diameter_mm, color: modeColor('ammo')}, ammoMarks(v))) +
    '<div class="who">' + whoText(t.shooter || 'Ammo test', t.label) + '</div>' +
    '<div class="scorebox"><div class="tot"><div class="big num">' + (a.shots ? a.size_mm.toFixed(1) : '–') + '</div><div class="sub">mm group</div><div class="sub num">' + v.count + ' shots</div></div>' +
    '<div class="rows">' + (a.shots ? '<div class="kv"><span>Spread c-c</span><b>' + mm2(a.spread_cc_mm) + ' mm</b></div>' +
      '<div class="kv"><span>Oval</span><b>' + mm2(e.outer_major_mm) + ' × ' + mm2(e.outer_minor_mm) + '</b></div>' +
      '<div class="kv"><span>Mean radius</span><b>' + mm2(a.mean_radius_mm) + ' mm</b></div>' : '<span class="mut">no shots yet</span>') + '</div></div></a>';
}
function coachCard(t) {
  if (t.kind === 'ammo' && t.view.ammo) return ammoCard(t);
  const v = t.view, pr = t.calibre_x10 / 20, half = halfFor('auto', v.bull_shots, pr);
  return '<a class="card ' + (t.online ? '' : 'off') + '" href="#/t/' + esc(t.device_id) + '">' +
    '<div class="row"><b><span class="dot ' + (t.online ? 'on' : '') + '"></span>' + esc(t.name) + '</b>' + badge(t.mode) + '</div>' +
    (t.online ? '' : '<div class="mut">offline, last seen ' + esc(clock(t.last_seen)) + '</div>') +
    faceSvg(v.bull_shots, {mini: true, half: half, pellet: t.calibre_x10 / 10, color: modeColor(t.mode), corner: t.mode !== 'record'}) +
    '<div class="who">' + esc(t.shooter || '–') + '</div>' +
    '<div class="scorebox"><div class="tot"><div class="big num">' + dec(v.agg.decimal) + '</div><div class="sub num">' + v.agg.integer + '</div><div class="sub num">X ' + v.agg.x + '</div></div>' +
    '<div class="rows">' + groupsRow(v) + strip(v) + '</div></div></a>';
}
function coachView(targets) {
  if (!targets.length) return '<p class="mut">No targets have reported yet. Power one on and check its WiFi setup.</p>';
  return '<p class="mut">' + targets.filter(t => t.online).length + ' of ' + targets.length + ' targets online</p><div class="grid">' + targets.map(coachCard).join('') + '</div>';
}

// ---- Single target ----
function reviewPager(v, ammo) {
  const k = v.count, full = v.full_count, ps = reviewPage(Object.assign({}, v, {kind: ammo ? 'ammo' : v.kind}));
  if (!full) return '<div class="pager"><span class="mut">No shots in this series</span></div>';
  const b = (move, label, title, off) => '<button data-act="rnav" data-move="' + move + '" title="' + title + '" aria-label="' + title + '"' + (off ? ' disabled' : '') + '>' + label + '</button>';
  const targetNote = ammo ? '' : ' · target ' + (v.bull_index + 1) + ' of ' + Math.ceil(full / ps);

// ---- Sight adjustment (practice only, for whoever is in control) ----

// ---- browser only from here ----
const S = {targets: [], review: null, reviewView: null, seriesList: [], gear: false, adv: false, zoom: 'auto', sse: false, busy: false, again: false,
           sight: null, cpr: CPR_DEFAULT, marks: {}};
let CID;
function store(k, v) { try { if (v === undefined) return localStorage.getItem(k); localStorage.setItem(k, v); } catch (e) { return null; } }
function clientId() {
  CID = store('fet_cid') || Array.from(crypto.getRandomValues(new Uint8Array(12)), b => b.toString(16).padStart(2, '0')).join('');
  store('fet_cid', CID);
}
async function get(p) { const r = await fetch(API + p); if (!r.ok) throw new Error(r.status); return r.json(); }
async function adminCall(p, body) {        // the custom header keeps other web sites from making these requests
  const r = await fetch(API + '/admin' + p, body === undefined ? {headers: {'X-FET-Admin': '1'}, credentials: 'same-origin'}
    : {method: 'POST', headers: {'Content-Type': 'application/json', 'X-FET-Admin': '1'}, credentials: 'same-origin', body: JSON.stringify(body)});
  return {status: r.status, data: await r.json().catch(() => ({}))};
}
async function post(p, body) {
  const r = await fetch(API + p, {method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(Object.assign({client_id: CID}, body))});
  return {status: r.status, data: await r.json().catch(() => ({}))};
}
function toast(m) { const t = document.getElementById('toast'); t.textContent = m; t.style.display = 'block'; clearTimeout(t._h); t._h = setTimeout(() => t.style.display = 'none', 3500); }
const route = () => { if (/^#\/range\b/.test(location.hash)) return {range: true}; const m = location.hash.match(/^#\/t\/([\w-]+)/); return m ? {id: m[1]} : {}; };
const current = () => { const r = route(); return r.id && S.targets.find(x => x.device_id === r.id); };

async function refresh() {
  if (S.busy) { S.again = true; return; }
  S.busy = true;
  try {
    S.targets = (await get('/targets?client_id=' + CID)).targets;
    const t = current();
    if (t && S.review) {
      S.reviewView = await get('/series/' + S.review.sid + '?stream=' + S.review.stream + '&upto=' + S.review.shot);
      const full = S.reviewView.full_count;
      if (S.review.shot > full || (S.review.shot < 1 && full)) {          // the series is shorter than expected, or empty when we started
        S.review.shot = Math.max(full ? 1 : 0, Math.min(full, S.review.shot));
        S.reviewView = await get('/series/' + S.review.sid + '?stream=' + S.review.stream + '&upto=' + S.review.shot);
      }
    }
    if (S.sight && (!sightAllowed(t, S) || t.view.series_id !== S.sight.sid)) S.sight = null;   // never outside live practice in control
    if (S.sight && !S.sight.exit) S.sight.data = await get('/series/' + S.sight.sid + '/sight?after=' + S.sight.after);
    if (route().range) {
      S.rc = S.rc || {sel: {}};
      S.rc.status = (await adminCall('/status')).data;
      if (S.rc.status.logged_in) {
        const res = await adminCall('/targets');
        if (res.status === 200) S.rc.data = res.data; else S.rc.status.logged_in = false;
        const fw = await adminCall('/firmware');
        if (fw.status === 200) S.rc.images = fw.data.images;
        const up = await adminCall('/updates');
        if (up.status === 200) {
          const msg = S.rc.updates && S.rc.updates.msg, check = S.rc.updates && S.rc.updates.last_check;
          S.rc.updates = Object.assign(up.data, {msg: msg, last_check: up.data.last_check || check});
          if (S.version && up.data.current !== S.version) location.reload();    // the server was updated: load the new page
        }
      }
    }
    if (t && S.gear) S.seriesList = (await get('/targets/' + t.device_id + '/series?limit=50')).series;
    render();
  } catch (e) { document.getElementById('live').textContent = 'server unreachable'; }
  S.busy = false;
  if (S.again) { S.again = false; refresh(); }
}

function render() {
  const app = document.getElementById('app'), t = current(), r = route();
  document.getElementById('nav-coach').className = r.id || r.range ? '' : 'on';
  document.getElementById('nav-range').className = r.range ? 'on' : '';
  document.getElementById('live').textContent = S.sse ? 'live' : 'updating every 5 s';
  const ae = document.activeElement;
  if (r.range && app.contains(ae) && ae.tagName === 'INPUT' && ae.type === 'password') return;   // never redraw under typing
  app.innerHTML = r.range ? rangeView(S) : r.id ? (t ? shooterView(t, S) : '<p>Unknown target. <a href="#/">Back</a></p>') : coachView(S.targets);
  renderOverlay(t);
}
function renderOverlay(t) {
  const o = document.getElementById('overlay');
  o.className = (S.gear || S.sight) && t ? 'open' : '';
  if (!(S.gear || S.sight) || !t) { o.innerHTML = ''; return; }
  const ae = document.activeElement;
  if (o.contains(ae) && /^(INPUT|SELECT)$/.test(ae.tagName)) { sightRedraw(t); return; }   // never redraw under someone's typing
  o.innerHTML = S.sight ? sightView(t, S) : overlayView(t, S, store('fet_name') || '');
}
function sightRedraw(t) {
  const r = document.getElementById('sightres');
  if (S.sight && r && t) r.innerHTML = sightResult(S.sight.data, S.cpr, t.calibre_x10 / 10);
}

async function act(el) {
  const t = current(), id = t && t.device_id, a = el.dataset.act, val = n => (document.getElementById(n) || {}).value;
  const setMode = async (mode, extra) => {
    const res = await post('/targets/' + id + '/mode', Object.assign({mode: mode}, extra || {}));
    if (res.status === 403) toast('You no longer have control of this target'); else if (res.status !== 200) toast(res.data.error || 'Could not change mode');
    return res;
  };
  if (a === 'zoom') { S.zoom = el.dataset.z; store('fet_zoom', S.zoom); return render(); }
  if (a === 'gear') { S.gear = true; S.sight = null; await refresh(); return; }
  if (a === 'sight') {
    if (!sightAllowed(t, S)) return;
    S.sight = {sid: t.view.series_id, after: sightMark(S, t.view.series_id), data: null, exit: false};
    return refresh();
  }
  if (/^sight(done|back|noadj|keep)$/.test(a) && !S.sight) return render();   // closed meanwhile (mode or control changed)
  if (a === 'sightdone') { S.sight.exit = true; return render(); }
  if (a === 'sightback') { S.sight.exit = false; return refresh(); }
  if (a === 'sightnoadj') { S.sight = null; return render(); }
  if (a === 'sightkeep') {
    const sid = S.sight.sid, last = t && t.view.series_id === sid && t.view.last_shot ? t.view.last_shot.n : 0;
    S.marks[sid] = last;
    const keep = Object.keys(S.marks).map(Number).sort((p, q) => q - p).slice(0, 20), m = {};   // the 20 newest series are plenty
    keep.forEach(k => { m[k] = S.marks[k]; });
    S.marks = m; store('fet_sight_marks', JSON.stringify(m));
    S.sight = null; return render();
  }
  if (a === 'gearclose') { S.gear = false; return render(); }
  if (a === 'rback') { S.review = null; S.reviewView = null; return render(); }
  if (a === 'review') { S.review = {sid: +el.dataset.sid, stream: 'scored', shot: 1}; S.gear = false; return refresh(); }   // reviews start at shot 1
  if (a === 'rstream') { S.review.stream = el.dataset.stream; S.review.shot = 1; return refresh(); }
  if (a === 'rnav') return reviewMove(el.dataset.move);
  if (/^rc/.test(a)) return rangeAct(el, a);
  if (!id) return;
  if (a === 'take' || a === 'takeover') {
    const name = (val('who') || store('fet_name') || '').trim();
    if (!name) return toast('Enter your name first');
    store('fet_name', name);
    let res = await post('/targets/' + id + '/control', {name: name, takeover: a === 'takeover'});
    if (res.status === 409 && confirm(res.data.held_by + ' is in control. Take over?')) res = await post('/targets/' + id + '/control', {name: name, takeover: true});
    if (res.status !== 200 && res.status !== 409) toast(res.data.error || 'Could not take control');
  } else if (a === 'release') {
    await post('/targets/' + id + '/control/release', {});
  } else if (a === 'mode') {
    await setMode(el.dataset.mode);
  } else if (a === 'kind') {
    if (el.dataset.kind !== t.kind) await setMode(KIND_MODE[el.dataset.kind]);
  } else if (a === 'setlabel') {
    await setMode('ammo', {label: val('label') || ''});
  } else if (a === 'setshooter') {
    const who = (val('shooter') || '').trim();
    if (who) await setMode(t.mode, {shooter: who});
  } else if (a === 'sightclear') {
    S.sight = null;
    await setMode('practice', {new_series: true});
  } else if (a === 'newseries') {
    await setMode(KIND_MODE[t.kind] || 'practice', {new_series: true});
  } else if (a === 'proj' || a === 'saveproj') {
    const mm = a === 'proj' ? +el.dataset.mm : parseFloat(val('f_proj'));
    if (!(mm >= 1 && mm <= 10)) return toast('Enter a size between 1 and 10 mm');
    const res = await post('/targets/' + id + '/settings', {projectile_mm: mm});
    if (res.status === 200) toast('Projectile set to ' + res.data.projectile_mm + ' mm'); else toast(res.data.error || 'Could not set the size');
  } else if (a === 'savesettings') {
    const n = k => { const v = parseInt(val(k), 10); return isNaN(v) ? undefined : v; };
    const res = await post('/targets/' + id + '/settings', {bull_size: n('f_bull'), group_size: n('f_group'), total_practice: n('f_tp'), total_match: n('f_tm')});
    if (res.status === 200) toast('Saved'); else toast(res.data.error || 'Could not save');
  }
  S.review = null; S.reviewView = null;
  refresh();
}

async function rangeAct(el, a) {
  const rc = S.rc = S.rc || {sel: {}}, sel = rc.sel = rc.sel || {};
  const chosen = () => ((rc.data || {}).targets || []).map(t => t.device_id).filter(i => sel[i]);
  if (a === 'rcsel') { sel[el.dataset.id] = el.checked; return render(); }
  if (a === 'rcall') { ((rc.data || {}).targets || []).forEach(t => { sel[t.device_id] = el.checked; }); return render(); }
  if (a === 'rclogin') {
    const pw = (document.getElementById('rcpw') || {}).value || '';
    if (!pw) return;
    const res = await adminCall('/login', {password: pw});
    rc.msg = res.status === 200 ? '' : res.status === 429 ? 'Too many wrong passwords from this device. Try again in ' + Math.ceil((res.data.retry_after || 600) / 60) + ' min.'
           : res.status === 401 ? 'Wrong password.' : (res.data.error || 'Could not log in');
    document.activeElement && document.activeElement.blur();
    return refresh();
  }
  if (a === 'rcupcheck') {
    rc.updates = Object.assign(rc.updates || {}, {msg: 'Asking GitHub…'}); render();
    const res = await adminCall('/updates/check', {});
    rc.updates = res.status === 200 ? Object.assign(res.data, {msg: ''}) : Object.assign(rc.updates, {msg: res.data.error || 'Check failed'});
    return render();
  }
  if (a === 'rcupinstall') {
    const v = el.dataset.v;
    if (!confirm('Install FeT Monitor v' + v + ' now?\n\nThe server restarts (about a minute; shots keep queueing on the targets). The database is backed up first, ' +
        'and if the new version does not start, the previous one comes back by itself.')) return;
    rc.updates.msg = 'Downloading and checking v' + v + '…'; render();
    const res = await adminCall('/updates/install', {version: v});
    rc.updates.msg = res.status === 202 ? '' : (res.data.error || 'Not installed');
    if (res.status === 202) toast('Update to v' + v + ' started');
    return refresh();
  }
  if (a === 'rcfwgh') {
    rc.fwMsg = 'Asking GitHub…'; rc.fwMsgBad = false; render();
    const res = await adminCall('/firmware/github', {});
    rc.fwMsg = res.status === 200 ? 'GitHub: ' + res.data.message + '.' : 'GitHub: ' + (res.data.error || 'check failed');
    rc.fwMsgBad = res.status !== 200;
    return refresh();
  }
  if (a === 'rcpick') { rc.fwPick = el.dataset.sha; return render(); }
  if (a === 'rcupload') {
    if (!rc.file) return;
    rc.fwMsg = 'Uploading ' + rc.file.name + '…'; rc.fwMsgBad = false; render();
    const r = await fetch(API + '/admin/firmware', {method: 'POST', credentials: 'same-origin', body: rc.file,
      headers: {'Content-Type': 'application/octet-stream', 'X-FET-Admin': '1'}}).catch(() => null);
    const d = r ? await r.json().catch(() => ({})) : {};
    if (r && r.status === 200) { rc.fwMsg = 'Uploaded ' + d.version + ' (' + d.sha256.slice(0, 12) + '…).'; rc.fwPick = d.sha256; rc.file = null; }
    else { rc.fwMsg = 'Not accepted: ' + (d.error || (r ? 'error ' + r.status : 'upload failed')); rc.fwMsgBad = true; }
    return refresh();
  }
  if (a === 'rcfwdel') {
    if (!confirm('Delete this firmware image from the Pi?')) return;
    await adminCall('/firmware/' + el.dataset.sha + '/delete', {});
    return refresh();
  }
  if (a === 'rcflash' || a === 'rcbest') {
    const ids = chosen(), img = (rc.images || []).find(m => m.sha256 === el.dataset.sha);
    if (!ids.length || (a === 'rcflash' && !img)) return;
    if (!confirm(a === 'rcbest' ? 'Update ' + ids.length + ' target(s) to the best FeT Bridge firmware for each?\nEach one downloads it, checks it and restarts (about a minute).'
                                : 'Install FeT Bridge firmware ' + img.version + ' on ' + ids.length + ' target(s)?\nEach one downloads it, checks it and restarts (about a minute).')) return;
    const errs = [];
    let sent = 0;
    for (const id of ids) {
      const res = await adminCall('/targets/' + encodeURIComponent(id) + '/firmware', {sha256: a === 'rcbest' ? 'best' : img.sha256});
      if (res.status === 200) sent++;
      if (res.status === 401) { toast('Logged out: log in again'); break; }
      if (res.status !== 200) errs.push(res.data.error || ('error ' + res.status));
    }
    rc.fwMsg = (sent ? 'Update sent to ' + sent + ' target(s). ' : '') + (errs.length ? 'Not sent to ' + errs.length + ' target(s): ' + errs.join(' · ') : '');
    rc.fwMsgBad = errs.length > 0;
    return refresh();
  }
  if (a === 'rcreset') {                      // for selling or disposing of a target: one at a time, with the name typed in
    const ids = chosen(), t = ((rc.data || {}).targets || []).find(x => x.device_id === ids[0]);
    if (ids.length !== 1 || !t) return toast('Select exactly one target');
    const q = t.queue_depth || 0;
    if (!confirm('FACTORY RESET ' + t.name + ' (' + t.device_id + ')?\n\n' +
        'Its FeT Bridge erases everything it stored: club WiFi name and password, server address and token, its name' +
        (q ? ', and ' + q + ' shot' + (q === 1 ? '' : 's') + ' NOT YET DELIVERED, which will be lost' : '') + '.\n' +
        'It then restarts as a new unit with an open setup WiFi and drops off this list. Shots already received stay in the history.\n\n' +
        'This cannot be undone. Use it before selling or disposing of a target.')) return;
    const typed = prompt('Type the target\'s name to confirm: ' + t.name);
    if (typed === null) return;
    if (typed.trim() !== t.name) return toast('The name did not match: nothing was reset');
    const res = await adminCall('/targets/' + encodeURIComponent(t.device_id) + '/command', {type: 'factory_reset'});
    if (res.status === 200) toast(t.name + ': factory reset sent; it erases itself at its next report');
    else toast(res.data.error || 'Factory reset not sent');
    delete sel[t.device_id];
    return refresh();
  }
  if (a === 'rclogout') { await adminCall('/logout', {}); rc.data = null; rc.sel = {}; return refresh(); }
  const ids = a === 'rcunban' ? [el.dataset.id] : chosen();
  if (!ids.length) return;
  const names = ids.map(i => { const t = ((rc.data || {}).targets || []).find(x => x.device_id === i); return t ? t.name : i; }).join(', ');
  if (a === 'rcremove' && !confirm('Remove ' + names + '?\nIts history is kept. It comes back by itself if it reports again.')) return;
  if (a === 'rccmd' && !confirm((el.dataset.type === 'reboot' ? 'Restart ' : 'Open the setup portal on ') + names + '?' +
      (el.dataset.type === 'reboot' ? '' : '\nIt opens the open WiFi network FeTMonitor-xxxxxx for 15 minutes; shots keep flowing.'))) return;
  if (a === 'rcban' && !confirm('Ban ' + names + '?\nEverything it sends is refused until you unban it.')) return;
  const path = {rcmode: 'mode', rcnew: 'mode', rcremove: 'remove', rcban: 'ban', rcunban: 'unban', rccmd: 'command'}[a];
  let failed = 0;
  for (const id of ids) {
