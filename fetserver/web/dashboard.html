<style>

<body>
<header><h1>FeT Monitor</h1><a href="#/" id="nav-coach">All targets</a><a href="#/results" id="nav-results">Results</a><a href="#/match" id="nav-match">Match Control</a><a href="#/range" id="nav-range">Range Control</a><span id="live">connecting…</span><button id="theme" data-act="theme" aria-label="Switch between light and dark">Dark</button><span id="power" hidden><button data-act="rcsys" data-a="restart" title="Restart the Pi">Restart</button><button class="danger" data-act="rcsys" data-a="shutdown" title="Shut the Pi down">Shut down</button></span></header>

<script>
'use strict';
const API = '/api/v1', MODES = {practice: 'Practice', sighter: 'Sighter', record: 'Record', ammo: 'Ammo test'};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const dec = v => (v == null ? '–' : v.toFixed(1));
// Target faces come from the server (fetserver/faces.py, faces.view): ring diameters, the black, the projectile.
// Without one (shots from before faces, a page without data) it is the ISSF 10 m air rifle face.
const AR10 = {id: 'issf-ar10', name: '10 m Air Rifle (ISSF)', decimal: true, black_mm: 30.5, white_ten: true, inner_mm: null, projectile_mm: 4.5, ring_mm: 2.5,
  rings: [0.5, 5.5, 10.5, 15.5, 20.5, 25.5, 30.5, 35.5, 40.5, 45.5].map((d, i) => ({value: 10 - i, dia_mm: d}))};
const faceOf = F => (F && F.rings && F.rings.length ? F : AR10);
const lowestRing = F => faceOf(F).rings[faceOf(F).rings.length - 1].value;
const ringRf = (F, k) => { const r = faceOf(F).rings.find(x => x.value === k); return r ? r.dia_mm / 2 : null; };   // outer radius, mm
const ringR = k => ringRf(AR10, k);                // the 10 m air rifle face (0.25 + 2.5 mm a ring)
const fullHalf = F => +(ringRf(F, lowestRing(F)) + 1.3 * faceOf(F).ring_mm).toFixed(3);   // the whole face, with a margin
const FULL = 26, AUTO_START = 8;                 // full view half-width in mm (air rifle); Auto never zooms in past the 8 ring
const zoomHalf = (k, F) => +(ringRf(F, k) + 0.6 * faceOf(F).ring_mm).toFixed(3);   // view half-width when zoomed to ring k

// Auto zoom: the smallest ring (8, 7 ... the lowest) that holds every pellet completely, else the whole face.
function autoRing(shots, pr, start, F) {
  let ext = 0;
  shots.forEach(s => { if (!s.miss && s.x_mm != null) ext = Math.max(ext, Math.hypot(s.x_mm, s.y_mm) + pr); });
  for (let k = Math.min(start || AUTO_START, 9); k >= lowestRing(F); k--) if (ringRf(F, k) != null && ringRf(F, k) >= ext) return k;
  return 0;
}
function halfFor(zoom, shots, pr, start, F) {
  if (zoom === 'auto') { const k = autoRing(shots, pr, start, F); return k ? zoomHalf(k, F) : fullHalf(F); }
  const k = parseInt(zoom, 10);

async function uploadFirmware(files) {
  const rc = S.rc = S.rc || {sel: {}};
  rc.uploading = true; rc.fwMsg = ''; rc.fwResults = files.map(f => ({name: f.name, ok: true, text: 'waiting'}));
  render();
  for (let i = 0; i < files.length; i++) {
    const f = files[i], out = rc.fwResults[i];
    if (f.size > 1048576) { out.ok = false; out.text = 'too big for a FeT Bridge image (1 MB at most)'; render(); continue; }
    out.text = 'uploading…'; render();
    const r = await fetch(API + '/admin/firmware', {method: 'POST', credentials: 'same-origin', body: f,
      headers: {'Content-Type': 'application/octet-stream', 'X-FET-Admin': '1'}}).catch(() => null);
    const d = r ? await r.json().catch(() => ({})) : {};
    if (r && r.status === 200) { out.text = 'stored ' + d.version + ' for ' + Math.round(d.flash_size / 1048576) + ' MB flash'; rc.fwPick = d.sha256; }
    else { out.ok = false; out.text = 'not accepted: ' + (d.error || (r ? 'error ' + r.status : 'upload failed')); if (r && r.status === 401) { toast('Logged out: log in again'); break; } }
    render();
  }
  rc.uploading = false;
  return refresh();
}

function clockTick() {                            // between refreshes: count down, and speak commands on the console

    if (!b) (S.boardComps || []).forEach(c => c.relays.forEach(r => { if ('tv-c' + c.id + '-' + r.match_id === el.dataset.clock) b = r; }));
    if (b && ['running', 'paused', 'holding'].includes(b.state)) el.textContent = fmtClock(remainingNow(b.clock, S.boardOffset));
