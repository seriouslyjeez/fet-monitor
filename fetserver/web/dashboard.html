<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>FeT Monitor</title>
<script id="early-theme">try { const th = localStorage.getItem('fet_theme'); if (th === 'dark' || th === 'light') document.documentElement.dataset.theme = th; } catch (e) {}</script>
<style>
:root{color-scheme:light;--bg:#f4f5f7;--fg:#15181d;--mut:#667085;--card:#fff;--line:#d9dde3;--accent:#2563eb;--ok:#16a34a;--bad:#dc2626;--hi:#e0ebff;--m-practice:#64748b;--m-sighter:#d97706;--m-record:#2563eb;--m-ammo:#9333ea;--last:#e11d48;--link:#1d4ed8;--on-accent:#fff}
/* dark: follows the system unless the viewer chose (header toggle sets data-theme on <html>) */
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){color-scheme:dark;--bg:#0f1216;--fg:#e8eaed;--mut:#98a2b3;--card:#181c22;--line:#2b313a;--accent:#60a5fa;--ok:#4ade80;--bad:#f87171;--hi:#1e2a44;--m-practice:#94a3b8;--m-sighter:#fbbf24;--m-record:#60a5fa;--m-ammo:#c084fc;--last:#fb7185;--link:#93c5fd;--on-accent:#0b1220}}
:root[data-theme=dark]{color-scheme:dark;--bg:#0f1216;--fg:#e8eaed;--mut:#98a2b3;--card:#181c22;--line:#2b313a;--accent:#60a5fa;--ok:#4ade80;--bad:#f87171;--hi:#1e2a44;--m-practice:#94a3b8;--m-sighter:#fbbf24;--m-record:#60a5fa;--m-ammo:#c084fc;--last:#fb7185;--link:#93c5fd;--on-accent:#0b1220}
a{color:var(--link)}a:visited{color:var(--link)}a:hover{text-decoration-thickness:2px}
#theme{margin-left:8px;padding:3px 9px;font-size:13px}
*{box-sizing:border-box}body{margin:0;font:15px/1.35 system-ui,sans-serif;background:var(--bg);color:var(--fg)}
header{display:flex;align-items:center;gap:14px;padding:6px 14px;background:var(--card);border-bottom:1px solid var(--line)}
header h1{font-size:15px;margin:0}header a{color:var(--fg);text-decoration:none;padding:3px 9px;border-radius:6px;font-size:14px}header a.on{background:var(--accent);color:var(--on-accent)}
#live{margin-left:auto;font-size:12px;color:var(--mut)}main{padding:12px;max-width:1500px;margin:0 auto}
.dot{display:inline-block;width:10px;height:10px;border-radius:50%;background:var(--bad);margin-right:6px}.dot.on{background:var(--ok)}
.mut{color:var(--mut);font-size:13px}.num{font-variant-numeric:tabular-nums}
.badge{font-size:12px;font-weight:600;padding:1px 9px;border-radius:99px;color:var(--on-accent);white-space:nowrap}.m-practice{background:var(--m-practice)}.m-sighter{background:var(--m-sighter)}.m-record{background:var(--m-record)}.m-ammo{background:var(--m-ammo)}
button,input,select{font:inherit;padding:7px 12px;border-radius:8px;border:1px solid var(--line);background:var(--card);color:var(--fg)}
button{cursor:pointer}button.pri{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}button.sel{background:var(--accent);color:var(--on-accent);border-color:var(--accent)}button:disabled{opacity:.45;cursor:default}
.face{display:block;width:100%;height:auto;border-radius:6px}
/* all targets */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}
.card{display:block;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;color:inherit;text-decoration:none}
.card:hover{border-color:var(--accent)}.card.off{opacity:.55}.row{display:flex;align-items:center;justify-content:space-between;gap:8px}
.card .face{margin:8px auto;max-width:300px}.who{font-weight:600;margin:2px 0 6px;min-height:1.35em}
.scorebox{display:flex;gap:8px;align-items:stretch}
.tot{flex:0 0 96px;border:1px solid var(--line);border-radius:8px;text-align:center;padding:6px 4px;background:var(--hi)}
.tot .big{font-size:28px;font-weight:800;line-height:1.05}.tot .sub{font-size:14px;color:var(--mut)}
.rows{flex:1;min-width:0;display:flex;flex-direction:column;justify-content:space-between;gap:6px}
.grprow{display:grid;grid-template-columns:repeat(6,minmax(0,1fr));gap:3px}.grp{border:1px solid var(--line);border-radius:6px;padding:1px 2px;text-align:center;line-height:1.15;min-width:0}
.grp b{display:block;font-size:13px}.grp small{display:block;color:var(--mut);font-size:10.5px}.grp.part{border-style:dashed}
.shotrow{display:grid;gap:2px}.cell{min-width:0;text-align:center;font-size:12px;padding:3px 0;border-radius:4px;background:var(--bg);min-height:23px;font-variant-numeric:tabular-nums}
.cell.x{background:var(--accent);color:var(--on-accent);font-weight:700}.cell.m{color:var(--bad);font-weight:700}.cell.e{opacity:.5}
/* single target */

.shoot{--face:min(calc(100vh - 64px),calc(min(100vw,1500px) - 380px));display:grid;grid-template-columns:var(--face) minmax(330px,1fr);gap:14px;align-items:start}
.shoot .left .face{width:var(--face);height:var(--face);max-width:none}

.topbar{display:flex;justify-content:space-between;align-items:center;gap:6px;flex-wrap:wrap}.topbar .zoombar{margin:0;gap:2px}.topbar .zoombar button{min-width:30px;padding:4px 7px}
.exitbar{display:flex;justify-content:flex-end;margin-top:auto}.exitbar button{padding:9px 18px}

body.rangemode header,body.rangemode #ver{display:none}body.rangemode main{max-width:none;padding:8px}
body.rangemode .shoot{--face:min(calc(100vh - 16px),calc(100vw - 370px))}

.phone .face{width:100%;height:auto;margin:6px 0}.phone .row{gap:8px}.menubtn{font-size:20px;padding:4px 12px;line-height:1}
.pmenu{display:flex;flex-direction:column;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px;margin:6px 0}
.pmenu>button,.pmenu>a{text-align:left;padding:10px 12px}.pmenu .zoombar button{min-width:30px;padding:4px 7px}
.pscore{display:flex;gap:12px;align-items:baseline;flex-wrap:wrap}.pscore .v{font-size:40px;font-weight:800;line-height:1}
.zoombar{display:flex;gap:3px;align-items:center;margin-bottom:6px;flex-wrap:wrap}.zoombar span{font-size:13px;color:var(--mut);margin-right:4px}
.zoombar button{padding:4px 9px;min-width:34px;font-size:14px}

.pager{display:flex;justify-content:center;align-items:center;gap:8px;margin-top:8px;flex-wrap:wrap}.pager button{min-width:44px;font-weight:700;font-size:16px}.pager span{min-width:150px;text-align:center}
.panel{background:var(--card);border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.panel h3{margin:0 0 6px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em;font-weight:600}
.gear{padding:3px 9px;font-size:18px;line-height:1}.title{font-size:20px;font-weight:700}
.modes{display:flex;gap:6px;margin-top:8px}.modes button{flex:1;font-weight:600;padding:9px}
table.t{width:100%;border-collapse:collapse}table.t td,table.t th{padding:3px 6px;text-align:right;border-bottom:1px solid var(--line)}

table.t td{font-variant-numeric:tabular-nums;height:27px}table.t tr.last td{background:var(--hi);font-weight:700}
.xm{color:var(--accent);font-weight:800;margin-left:4px}.miss{color:var(--bad);font-weight:700}
.lastwrap{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-start}.lastleft{flex:1 1 150px}.lastright{flex:2 1 240px;max-height:280px;overflow:auto}tr.tot-row td{font-weight:700;border-top:2px solid var(--line)}
.lastbig{display:flex;align-items:baseline;gap:10px}.lastbig .v{font-size:52px;font-weight:800;line-height:1}.lastbig .xbig{font-size:30px;color:var(--accent);font-weight:800}
.banner{background:var(--hi);border:1px solid var(--accent);border-radius:8px;padding:6px 10px;margin-bottom:10px;font-size:14px}
/* ammo test */
.lbl{font-weight:500;color:var(--mut)}.kv{display:flex;justify-content:space-between;gap:8px;font-size:13px;font-variant-numeric:tabular-nums}.kv span:first-child{color:var(--mut)}
.scroll{max-height:300px;overflow:auto}.unit{font-size:20px;color:var(--mut);font-weight:600}
table.t.kvt td{height:auto}table.t.kvt td:last-child{white-space:nowrap}
/* overlay */
#overlay{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;align-items:flex-start;justify-content:center;padding:16px;overflow:auto;z-index:10}
#overlay.open{display:flex}.sheet{background:var(--card);border-radius:12px;max-width:520px;width:100%;padding:14px 16px}
.sheet h2{margin:0 0 4px;font-size:18px}.sheet section{border-top:1px solid var(--line);padding:10px 0}.sheet section:first-of-type{border-top:0}
/* sight adjustment */
.sightface{max-width:300px;margin:0 auto}.advice{font-size:24px;font-weight:800;margin:4px 0}.advice div{margin:2px 0}
.cprrow{display:flex;gap:8px;align-items:center}.cprrow input{width:80px}.bad{color:var(--bad)}
/* range control */
.rc table.t td,.rc table.t th{text-align:left;vertical-align:middle}.rc .bulk{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin:10px 0}
.rc .scroll{max-height:none;overflow-x:auto}.rc .warnbox{border:1px solid var(--bad);border-radius:8px;padding:8px 10px;margin:8px 0}
.rc input[type=password]{width:220px;max-width:100%}.danger{color:var(--bad);border-color:var(--bad)}code{font-size:13px;word-break:break-all}
#ver{position:fixed;right:8px;bottom:6px;font-size:11px;color:var(--mut);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:1px 7px;opacity:.85;z-index:5;text-decoration:none}
.notes{white-space:pre-wrap;max-height:260px;overflow:auto;background:var(--bg);border:1px solid var(--line);border-radius:8px;padding:8px 10px;font:13px/1.45 ui-monospace,Menlo,monospace}
#ver:hover{opacity:1;color:var(--fg)}.fwres{margin:6px 0;padding-left:18px;font-size:13px}.fwjob{font-size:12px}.fwjob.bad{color:var(--bad)}.fwjob.ok{color:var(--ok)}
/* match control */
.mc table.t td,.mc table.t th{text-align:left}.cmdtext{font-size:22px;font-weight:700;margin:6px 0;min-height:1em}.cmdtext:empty{display:none}
button.big{font-size:18px;padding:12px 18px}.mcsaynow{background:#fde68a;color:#111;border-radius:8px;padding:6px 10px}.mcclock{font-size:64px;font-weight:800;font-variant-numeric:tabular-nums;line-height:1}.mcclock.paused{color:var(--mut)}
.mcphase{font-size:20px;font-weight:700}.mcwarn{color:var(--bad)}.mcbar{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}
.mcbanner{background:var(--hi);border:2px solid var(--accent);border-radius:10px;padding:8px 12px;margin-bottom:10px;display:flex;justify-content:space-between;align-items:center;gap:10px;flex-wrap:wrap}
.mcbanner .mcclock{font-size:44px}.phlist{font-size:13px}.phlist td{height:auto}.phlist tr.cur td{background:var(--hi);font-weight:700}
.mcform input[type=text],.mcform input[type=number],.mcform select{max-width:100%}.mcform .grid{display:grid;grid-template-columns:auto 1fr;gap:6px 10px;align-items:center}
/* print pages (result sheets, score cards): plain, black on white, page breaks between cards */
body.print header,body.print #ver{display:none}#printbar{max-width:900px;margin:10px auto 0;padding:0 10px}#printbar[hidden]{display:none}
@media (max-width:600px){header{flex-wrap:wrap;gap:4px 8px;padding:6px 8px}header a{padding:3px 6px}#live{display:none}#theme{margin-left:auto}}body.print main{max-width:900px;padding:10px}
.sheetpage{background:#fff;color:#111}.sheetpage a{color:#1d4ed8}.sheetpage .mut{color:#555}.sheetpage h1{font-size:22px;margin:0 0 2px}.sheetpage h2{font-size:17px;margin:14px 0 4px}
.sheetpage table{width:100%;border-collapse:collapse;font-size:13px;font-variant-numeric:tabular-nums}.sheetpage th,.sheetpage td{border:1px solid #999;padding:3px 5px;text-align:left}
.sheetpage th{background:#eee}.scard{break-after:page;page-break-after:always;padding-bottom:12px;margin-bottom:12px;border-bottom:2px dashed #bbb}
.scard .faces{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:6px;margin-top:6px}.scard .faces svg{width:100%;height:auto}
tr.guide td{border-top:0;padding-top:0}.resstatus{font-weight:700;margin:2px 0}.resstatus.prov{color:var(--m-sighter)}.resstatus.off{color:var(--ok)}.sheetpage tr.guide td{border-top:0;padding-top:0}.resstatus{color:#111}
.warnbox{border:1px solid var(--bad);border-radius:8px;padding:8px 10px;margin:8px 0}.dqbox{border:2px solid #b91c1c;color:#b91c1c;padding:4px 8px;margin:6px 0}.rulenotes{margin:4px 0 8px 18px;padding:0;font-size:13px}
.sign{display:flex;gap:30px;margin-top:20px}.sign div{flex:1;border-top:1px solid #111;padding-top:3px;font-size:12px}
@media print{.noprint{display:none!important}body{background:#fff}.scard{border:0}}
/* TV displays: no header, big type */
body.tv header{display:none}body.tv main{max-width:none;padding:10px 14px}body.tv #ver{display:none}
.tvclock{display:flex;justify-content:space-between;align-items:center;gap:12px;background:var(--card);border:2px solid var(--accent);border-radius:12px;padding:8px 16px;margin-bottom:10px}
.tvclock .mcclock{font-size:72px}.tvclock .mcphase{font-size:30px}.tvgrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:10px}
.board{margin-bottom:22px}.board h2{margin:0 0 6px;font-size:26px}.board table{width:100%;border-collapse:collapse;font-size:20px;font-variant-numeric:tabular-nums}
.board th{font-size:14px;color:var(--mut);text-align:left;padding:4px 8px;border-bottom:2px solid var(--line)}.board td{padding:5px 8px;border-bottom:1px solid var(--line);white-space:nowrap}
.board td.tot{font-weight:800;font-size:24px}.board td.l10{font-size:15px;color:var(--mut)}.board tr.top td{background:var(--hi)}.board .ser{font-size:15px}
.tvcfg label{display:block;margin:2px 0}.tvcfg .cols{display:grid;grid-template-columns:repeat(auto-fit,minmax(260px,1fr));gap:12px}
.sheet h4{margin:0 0 6px;font-size:13px;color:var(--mut);text-transform:uppercase;letter-spacing:.04em}
.seg{display:flex;gap:6px}.seg button{flex:1}.fields{display:grid;grid-template-columns:1fr 90px;gap:6px 10px;align-items:center}.fields input{width:100%}
.rev{display:block;width:100%;text-align:left;margin-bottom:5px}details>summary{cursor:pointer;font-weight:600}
#toast{position:fixed;bottom:16px;left:50%;transform:translateX(-50%);background:#111;color:#fff;padding:8px 14px;border-radius:8px;display:none;z-index:20}
</style>

<body>
<header><h1>FeT Monitor</h1><a href="#/" id="nav-coach">All targets</a><a href="#/results" id="nav-results">Results</a><a href="#/match" id="nav-match">Match Control</a><a href="#/range" id="nav-range">Range Control</a><span id="live">connecting…</span><button id="theme" data-act="theme" aria-label="Switch between light and dark">Dark</button></header>
<div id="printbar" class="noprint mcbar" hidden><button class="pri" data-act="print">Print</button><span id="printinfo" class="mut"></span></div>
<main id="app"></main>
<div id="overlay"></div>
<div id="toast"></div>
<input type="file" id="rcfile" accept=".bin,application/octet-stream" multiple hidden>
<input type="file" id="csvfile" accept=".csv,.txt,text/csv,text/plain" hidden>
<a id="ver" href="https://github.com/seriouslyjeez/fet-monitor" target="_blank" rel="noopener" title="FeT Monitor on GitHub">FeT Monitor</a>
<script>
'use strict';
const API = '/api/v1', MODES = {practice: 'Practice', sighter: 'Sighter', record: 'Record', ammo: 'Ammo test'};
const esc = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({'&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'}[c]));
const dec = v => (v == null ? '–' : v.toFixed(1));
const ringR = k => 0.25 + 2.5 * (10 - k);        // outer radius of ring k in mm (ISSF 10 m air rifle)
const FULL = 26, AUTO_START = 8;                 // full view half-width in mm; Auto never zooms in past the 8 ring
const zoomHalf = k => ringR(k) + 1.5;            // view half-width when zoomed to ring k

// Auto zoom: the smallest ring (8, 7 ... 1) that holds every pellet completely, else the full target.
function autoRing(shots, pr, start) {
  let ext = 0;
  shots.forEach(s => { if (!s.miss && s.x_mm != null) ext = Math.max(ext, Math.hypot(s.x_mm, s.y_mm) + pr); });
  for (let k = start || AUTO_START; k >= 1; k--) if (ringR(k) >= ext) return k;
  return 0;
}
function halfFor(zoom, shots, pr, start) {
  if (zoom === 'auto') { const k = autoRing(shots, pr, start); return k ? zoomHalf(k) : FULL; }
  const k = parseInt(zoom, 10);
  return k >= 1 && k <= 9 ? zoomHalf(k) : FULL;
}
const modeColor = m => 'var(--m-' + (MODES[m] ? m : 'practice') + ')';
const badge = m => '<span class="badge m-' + (MODES[m] ? m : 'practice') + '">' + esc(MODES[m] || 'Practice') + '</span>';
const clock = iso => new Date(iso).toLocaleTimeString([], {hour: '2-digit', minute: '2-digit'});
const when = iso => new Date(iso).toLocaleString([], {month: 'short', day: 'numeric', hour: '2-digit', minute: '2-digit'});
const KIND_MODE = {practice: 'practice', match: 'sighter', ammo: 'ammo'};   // the mode a series kind starts in
// Review navigation. k = shots shown so far (1..full), ps = shots per target picture.
// A step moves one shot. A page jump goes to the END of the current target picture, or, if already there, to the end of
// the next one; backwards it goes to the end of the previous picture (shot 1 from the first picture).
function reviewShot(k, ps, full, move) {
  const clamp = n => Math.max(full ? 1 : 0, Math.min(full, n)), page = Math.ceil(k / ps);
  if (move === 'step+') return clamp(k + 1);
  if (move === 'step-') return clamp(k - 1);
  if (move === 'page+') { const end = Math.min(full, page * ps); return clamp(k < end ? end : end + ps); }
  if (move === 'page-') return clamp((page - 1) * ps);
  return clamp(k);
}
const reviewPage = v => (v.kind === 'ammo' ? 10 : v.bull_size);   // shots per review jump: a target picture, or ten shots in an ammo test
// Ammo tests carry two names: the shooter (fixed once the test starts) and a label (ammo, lot) that can change.
const whoText = (shooter, label) => esc(shooter || '–') + (label ? ' · <span class="lbl">' + esc(label) + '</span>' : '');
const scoreText = s => s.miss ? 'M' : dec(s.decimal);
const mm2 = v => (v == null ? '–' : v.toFixed(2));
// Ammo test overlays for the face: the oval around the group and the group centre (both in mm relative to the first shot)
function ammoMarks(v) {
  const a = v && v.ammo;
  if (!a || !a.ellipse || a.shots < 2) return {};
  const e = a.ellipse;
  return {oval: {cx: e.cx_mm, cy: e.cy_mm, a: e.outer_major_mm / 2, b: e.outer_minor_mm / 2, ang: e.angle_deg}, center: {x: a.center_x_mm, y: a.center_y_mm}};
}

// Target face. Pure function returning an SVG string. Data y is up, screen y is down.
// o: half (view half-width, mm), pellet (mm), color, mini, corner (black top-right corner = shots are not scored),
// noLast (a printed score card: no colour for the latest shot)
function faceSvg(shots, o) {
  o = o || {};
  const mini = !!o.mini, pr = (o.pellet || 4.5) / 2, H = o.half || FULL, col = o.color || 'var(--accent)', black = ringR(4);
  const sw = Math.max(0.06, 0.18 * H / FULL) * (mini ? 1.6 : 1), f = Math.max(0.35, Math.min(1, H / 14));   // outlines thin out as we zoom in
  let s = '<svg class="face" viewBox="' + (-H) + ' ' + (-H) + ' ' + (2 * H) + ' ' + (2 * H) + '" role="img" aria-label="Target face">' +
          '<rect x="' + (-H) + '" y="' + (-H) + '" width="' + (2 * H) + '" height="' + (2 * H) + '" fill="#fff"/><circle r="' + black + '" fill="#111"/>';
  for (let k = 1; k <= 10; k++) {
    s += '<circle r="' + ringR(k) + '" fill="' + (k === 10 ? '#fff' : 'none') + '" stroke="' + (ringR(k) <= black ? '#fff' : '#111') + '" stroke-width="' + sw + '"/>';
  }
  if (!mini) {
    for (let k = 1; k <= 8; k++) {
      const m = ringR(k) - 1.25, fill = m < black ? '#fff' : '#111';
      if (m > H - 0.9) continue;
      [[0, -m], [0, m], [-m, 0], [m, 0]].forEach(p => {
        s += '<text x="' + p[0] + '" y="' + p[1] + '" font-size="1.7" text-anchor="middle" dominant-baseline="central" fill="' + fill + '">' + k + '</text>';
      });
    }
  }
  const pts = shots.filter(x => !x.miss && x.x_mm != null);
  pts.forEach((x, i) => {
    const isLast = i === pts.length - 1 && !o.noLast, sx = x.x_mm, sy = -x.y_mm;
    if (Math.abs(sx) <= H && Math.abs(sy) <= H) {                   // pellet centre is in view
      // A stroke is centred on the circle's edge, so the circle is drawn half a stroke smaller: the outer edge of the
      // outline is then exactly the pellet's edge, whatever the outline width.
      const w = (isLast && !mini && !x.flyer ? 0.6 : 0.35) * f, r = +(pr - w / 2).toFixed(4);
      if (x.flyer) s += '<circle class="flyer" cx="' + sx + '" cy="' + sy + '" r="' + r + '" fill="none" stroke="#e11d48" stroke-width="' + w + '" stroke-dasharray="' + 0.7 * f + '"/>';   // sight adjustment: ignored shot
      else if (isLast) s += '<circle class="pellet latest" cx="' + sx + '" cy="' + sy + '" r="' + r + '" fill="var(--last)" fill-opacity=".85" stroke="' +
           (mini ? 'var(--last)' : '#fff') + '" stroke-width="' + w + '"/>';     // the latest shot: its own colour, also on the small cards
      else s += '<circle class="pellet" cx="' + sx + '" cy="' + sy + '" r="' + r + '" fill="' + col + '" fill-opacity=".55" stroke="' + col + '" stroke-width="' + w + '"/>';
      if (!mini && (!o.labelLast || isLast)) {                       // an ammo test can have hundreds of shots: label only the latest
        s += '<text x="' + sx + '" y="' + sy + '" font-size="2" text-anchor="middle" dominant-baseline="central" fill="#fff" stroke="#000" stroke-width=".12" paint-order="stroke">' + esc(x.n) + '</text>';
      }
    } else {                                                         // outside a fixed zoom: mark where it went off
      const k = (H * 0.9) / Math.max(Math.abs(sx), Math.abs(sy)), r = Math.max(0.5, H * 0.07);
      s += '<circle cx="' + (sx * k) + '" cy="' + (sy * k) + '" r="' + r + '" fill="#fff" stroke="#e11d48" stroke-width="' + (r * 0.3) + '" stroke-dasharray="' + (r * 0.6) + '"/>';
      if (!mini) s += '<text x="' + (sx * k) + '" y="' + (sy * k) + '" font-size="' + (r * 1.3) + '" text-anchor="middle" dominant-baseline="central" fill="#e11d48">' + esc(x.n) + '</text>';
    }
  });
  if (o.oval) {                                                      // ammo test: oval around the group (white halo so it shows on black and white)
    const e = o.oval, w = (mini ? 0.5 : 0.26) * Math.max(0.5, f), t = 'rotate(' + (-e.ang) + ' ' + e.cx + ' ' + (-e.cy) + ')';
    [['#fff', w * 2.6], ['#c026d3', w]].forEach(c => {
      s += '<ellipse class="goval" cx="' + e.cx + '" cy="' + (-e.cy) + '" rx="' + e.a + '" ry="' + e.b + '" transform="' + t + '" fill="none" stroke="' + c[0] + '" stroke-width="' + c[1] + '" stroke-dasharray="' + (w * 6) + ' ' + (w * 3) + '"/>';
    });
  }
  if (o.center) {                                                    // ammo test: group centre (mean point of impact)
    const c = o.center, cl = Math.max(0.9, H * (mini ? 0.07 : 0.05)), w = (mini ? 0.5 : 0.26) * Math.max(0.5, f);
    [['#fff', w * 2.6], ['#c026d3', w]].forEach(k => {
      s += '<g class="gcenter" stroke="' + k[0] + '" stroke-width="' + k[1] + '" fill="none"><line x1="' + (c.x - cl) + '" y1="' + (-c.y) + '" x2="' + (c.x + cl) + '" y2="' + (-c.y) + '"/>' +
           '<line x1="' + c.x + '" y1="' + (-c.y - cl) + '" x2="' + c.x + '" y2="' + (-c.y + cl) + '"/><circle cx="' + c.x + '" cy="' + (-c.y) + '" r="' + (cl * 0.5) + '"/></g>';
    });
  }
  if (o.corner) {                                                    // practice and sighter shots are not scored
    const L = H * (mini ? 0.34 : 0.3);
    s += '<polygon class="corner" points="' + H + ',' + (-H) + ' ' + (H - L) + ',' + (-H) + ' ' + H + ',' + (-H + L) + '" fill="#dc2626"/>';
  }
  return s + '</svg>';
}

// ---- results (public): #/results, #/results/<key>, #/print/results/<key>, #/print/cards/<key>[?p=<competitor>] ----

function scoreCards(res, only) {

  const all = [];

  return '<div class="sheetpage" data-cards="' + all.length + '">' + all.map(([cl, e]) => {
    const shots = e.shot_list || [], groups = [];
    for (let i = 0; i < shots.length; i += 10) groups.push(shots.slice(i, i + 10));
    const one = v => res.scoring === 'decimal' ? (v.tenths / 10).toFixed(1) : String(v.ring);
    const val = s => (s.miss ? '0' : one(s)) + (s.inner ? '*' : '') + (s.decision ? '†' : '') + (s.added ? '<sup>A</sup>' : '') + (s.crossfire_to ? '<sup>CF</sup>' : '') +
      (s.orig ? ' <s>' + (s.orig.miss ? '0' : one(s.orig)) + '</s>' : '') + ((s.penalties || []).length ? '<sup>P</sup>' : '');
    const notes = [shots.some(s => s.inner) ? '* inner ten' : '', shots.some(s => s.decision) ? '† decided by the match director' : '',

      shots.some(s => s.orig) ? '<s>value</s> as fired, before the match director changed it' : '', shots.some(s => (s.penalties || []).length) ? 'P penalty taken off this shot' : ''].filter(Boolean);
    const extra = (e.dq ? '<div class="dqbox"><b>DISQUALIFIED</b> · ' + esc(e.dq.rule) + (e.dq.text ? ': ' + esc(e.dq.text) : '') + ' · decided by ' + esc(e.dq.by || '') + ' and ' + esc(e.dq.official) + '</div>' : '') +
      ((e.removed || []).length ? '<div class="mut">Not counted: ' + e.removed.map(r => 'shot ' + r.n + ' (' + esc(r.why) + ')').join(', ') + '</div>' : '') +
      ((e.penalties || []).length ? '<div class="mut">Penalties: ' + e.penalties.map(p => '−' + p.points + ' ' + esc(p.rule) + (p.text ? ' (' + esc(p.text) + ')' : '') + (p.note ? ' · ' + esc(p.note) : '')).join('; ') + '</div>' : '');
    return '<div class="scard"><h1>' + esc(e.name) + '</h1><div>' + esc(res.name) + ' · ' + esc(res.format_name) + (cl.name ? ' · class ' + esc(cl.name) : '') + (e.team ? ' · team ' + esc(e.team) : '') +
      (e.moved_from ? ' · relay ' + esc(e.moved_from.relay) + ', firing point ' + esc(e.moved_from.lane) + ', then (CMP 7.18)' : '') +
      (e.relay ? ' · relay ' + esc(e.relay) + ', firing point ' + esc(e.lane) : '') + '</div>' +
      '<div style="margin:6px 0"><b>Total ' + (e.dq ? 'DQ' : fmtScore(res, e.total)) + '</b> · ' + (res.scoring === 'decimal' ? 'inner tens ' : 'X ') + (e.dq ? '–' : e.x) + ' · place ' + (e.fired && !e.dq ? e.place + (e.tied ? '=' : '') : '–') + ' · ' + e.shots + ' / ' + res.record_shots + ' shots</div>' + extra +
      '<table><tr><th>Series</th>' + Array.from({length: 10}, (_, i) => '<th>' + (i + 1) + '</th>').join('') + '<th>Total</th></tr>' +
      groups.map((g, gi) => '<tr><td>' + (gi * 10 + 1) + '–' + (gi * 10 + g.length) + '</td>' + Array.from({length: 10}, (_, i) => '<td>' + (g[i] ? val(g[i]) : '') + '</td>').join('') + '<td><b>' + fmtScore(res, e.series[gi]) + '</b></td></tr>').join('') + '</table>' +
      '<div class="faces">' + groups.map((g, gi) => '<div><div class="mut">Shots ' + (gi * 10 + 1) + '–' + (gi * 10 + g.length) + '</div>' +
        faceSvg(g.filter(s => s.x_mm != null).map((s, i) => ({n: gi * 10 + i + 1, miss: false, x_mm: s.x_mm, y_mm: s.y_mm})), {half: halfFor('auto', g.filter(s => s.x_mm != null), 2.25), pellet: 4.5, color: '#2563eb', noLast: true}) + '</div>').join('') + '</div>' +
      (notes.length ? '<div class="mut">' + notes.join(' · ') + '</div>' : '') + '<div class="sign"><div>Competitor</div><div>Scorer / match director</div></div></div>';

    '<h4>Shots</h4><div class="scroll" style="max-height:55vh"><table class="t"><tr><th>#</th><th>Value</th><th>Time</th><th>Corrections</th><th></th></tr>' + L.shots.slice().reverse().map(row).join('') + '</table></div>' +

function commandsPanel(d) {                     // what the range officer says now (and, when they read them, the Next button)

  if (st === 'holding') {

    '<div class="mut">Given: “' + esc(c.start_say || c.label) + '”</div>' + (warn ? '<div class="mut">Coming: ' + warn + (c.end_say ? ' · at 0:00 “' + esc(c.end_say) + '”' : '') + '</div>' : '') +

function correctionsPanel(d, director) {        // mistakes happen: the match director can go back

  if (a === 'rcremove' && !confirm('Remove ' + names + '?\nIts history is kept. It comes back by itself if it reports again.')) return;

  return refresh();
}

async function uploadFirmware(files) {
  const rc = S.rc = S.rc || {sel: {}};
  rc.uploading = true; rc.fwMsg = ''; rc.fwResults = files.map(f => ({name: f.name, ok: true, text: 'waiting'}));
  render();
  for (let i = 0; i < files.length; i++) {
    const f = files[i], out = rc.fwResults[i];
    if (f.size > 1048576) { out.ok = false; out.text = 'too big for a FeT Bridge image (1 MB at most)'; render(); continue; }
    out.text = 'uploading…'; render();
    const r = await fetch(API + '/admin/firmware', {method: 'POST', credentials: 'same-origin', body: f,
      headers: {'Content-Type': 'application/octet-stream', 'X-FET-Admin': '1'}}).catch(() => null);
    const d = r ? await r.json().catch(() => ({})) : {};
    if (r && r.status === 200) { out.text = 'stored ' + d.version + ' for ' + Math.round(d.flash_size / 1048576) + ' MB flash'; rc.fwPick = d.sha256; }
    else { out.ok = false; out.text = 'not accepted: ' + (d.error || (r ? 'error ' + r.status : 'upload failed')); if (r && r.status === 401) { toast('Logged out: log in again'); break; } }
    render();
  }
  rc.uploading = false;
  return refresh();
}
