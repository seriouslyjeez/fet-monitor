# FeT Monitor: WiFi settings that also suit the Raspberry Pi 3's WiFi chip (BCM43438). With power saving on, it misses
# replies (joined, but no address); some routers' protected management frames (802.11w) trip its firmware. On a Pi 3
# the club WiFi worked only with the router in 802.11b mode (2026-11-03); a Pi 5 joined in any mode.
# Defaults for every WiFi connection on this Pi (NetworkManager conf.d); FeT Monitor's own connections set them too.
[connection]
wifi.powersave=2
wifi-sec.pmf=1
